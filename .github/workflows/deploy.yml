name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [main]
  # Allow manually triggering a deploy from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and use OIDC for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress one (let it finish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload the site
        # withastro/action auto-detects pnpm from pnpm-lock.yaml + the
        # `packageManager` field in package.json, runs the build, and uploads
        # the dist/ artifact for Pages.
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
