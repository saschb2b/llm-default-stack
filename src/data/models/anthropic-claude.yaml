vendor: Anthropic
family: Claude
kind: model
url: https://www.anthropic.com/claude
order: 1
blurb: >-
  Anthropic's model line reaches for the Vercel-flavoured React stack and is one
  of the heaviest shadcn/ui users — the only family to routinely add Zustand on
  top of TanStack Query. (Stack reflects agentic/production use; a bare chat
  stays modern but goes leaner — hand-rolled components, no data library.)
defaultStack:
  framework:
    - name: Next.js
    - name: Vite
      note: for lighter, SPA-style apps
  styling:
    - name: Tailwind
      note: v4
  components:
    - name: shadcn/ui
  stateData:
    - name: Zustand
    - name: TanStack Query
  backend:
    - name: Vercel
    - name: Supabase
# Library versions, from a bare-prompt probe of Opus 4.8 — the lag.
emits:
  - name: Next.js
    version: '15'
    note: bare-chat default framework; one major behind 16
  - name: React
    version: '19'
    note: current
  - name: Tailwind
    version: '4'
    note: current, CSS-first config
  - name: Vite
    version: '7'
    note: when asked for Vite specifically — one behind 8
# Modern-practice checklist, measured in a bare-prompt probe of Opus 4.8 (a touch
# more modern than its own hedged self-report — the code commits fully).
checklist:
  - id: app-router
    status: adopted
  - id: rsc-default
    status: adopted
    note: async Server Components; "use client" only on the interactive leaves
  - id: server-actions
    status: adopted
    note: login / logout / addTodo as Server Actions
  - id: react-compiler
    status: missing
    note: not enabled (no compiler dep/config); no memoization needed here
  - id: ref-as-prop
    status: adopted
    note: reusable Input takes ref as a prop, no forwardRef
  - id: form-actions
    status: adopted
    note: useActionState + <form action={fn}>
  - id: use-hook
    status: missing
    note: data awaited in async Server Components; metadata via Next's metadata export
  - id: tailwind-v4-config
    status: adopted
    note: '@import "tailwindcss" + @theme, no JS config'
  - id: ts-strict
    status: adopted
versions:
  - name: Claude Opus 4.8
    releaseDate: '2026-05-28'
    status: current
  - name: Claude Sonnet 4.6
    releaseDate: '2026-02-17'
    status: previous
  - name: Claude Sonnet 4.5
    releaseDate: '2025-09'
    status: previous
  - name: Claude 3.7 Sonnet
    releaseDate: '2025-02'
    status: legacy
  - name: Claude 3.5 Sonnet
    releaseDate: '2024-06'
    status: legacy
sources:
  - label: Bare-prompt probe run (Opus 4.8), June 2026
  - label: Six Models, One React Stack
    url: https://www.saschb2b.com/blog/llm-default-react-stack
