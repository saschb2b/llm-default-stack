vendor: Anthropic
family: Claude
kind: model
url: https://www.anthropic.com/claude
order: 1
blurb: >-
  Anthropic's model line reaches for the Vercel-flavoured React stack and is one
  of the heaviest shadcn/ui users — the only family to routinely add Zustand on
  top of TanStack Query.
defaultStack:
  framework:
    - name: Next.js
    - name: Vite
      note: for lighter, SPA-style apps
  styling:
    - name: Tailwind
      note: v4
  components:
    - name: shadcn/ui
  stateData:
    - name: Zustand
    - name: TanStack Query
  backend:
    - name: Vercel
    - name: Supabase
# Library versions the current flagship (Opus 4.8) emits by default — the lag.
emits:
  - name: Vite
    version: '7'
    note: scaffolds Vite 7 although Vite 8 has been stable since March 2026
  - name: Tailwind
    version: '4'
    note: current — Claude is one of the few already on the latest major
# Modern-practice checklist. Self-reported by Opus 4.8 (this very model) — these
# are my own default tendencies, and they're verifiable by testing me.
checklist:
  - id: app-router
    status: adopted
  - id: rsc-default
    status: adopted
    note: marks "use client" at the interactive leaves
  - id: server-actions
    status: partial
    note: mixes Server Actions with route handlers depending on the task
  - id: react-compiler
    status: missing
    note: writes manual useMemo/useCallback; doesn't assume the compiler is on
  - id: ref-as-prop
    status: partial
    note: still reaches for forwardRef out of habit (React 18-heavy training)
  - id: form-actions
    status: partial
    note: Actions for simple forms, controlled inputs otherwise
  - id: use-hook
    status: missing
    note: rarely reaches for use() or in-component document metadata by default
  - id: tailwind-v4-config
    status: adopted
    note: '@import "tailwindcss" + @theme rather than a JS config'
  - id: ts-strict
    status: adopted
versions:
  - name: Claude Opus 4.8
    releaseDate: '2026-05-28'
    status: current
  - name: Claude Sonnet 4.6
    releaseDate: '2026-02-17'
    status: previous
  - name: Claude Sonnet 4.5
    releaseDate: '2025-09'
    status: previous
  - name: Claude 3.7 Sonnet
    releaseDate: '2025-02'
    status: legacy
  - name: Claude 3.5 Sonnet
    releaseDate: '2024-06'
    status: legacy
sources:
  - label: Six Models, One React Stack
    url: https://www.saschb2b.com/blog/llm-default-react-stack
