  - name: Gemini 3.5 Pro
    status: preview
    notes: In testing at the time of writing.
  - name: Gemini 3.1 Pro
    releaseDate: '2026-02-19'
    status: previous
  - name: Gemini 3 Flash
    releaseDate: '2026'
    status: previous
  - name: Gemini 2.5 Pro
    releaseDate: '2025-03'
    status: legacy
sources:
  - label: Six Models, One React Stack
    url: https://www.saschb2b.com/blog/llm-default-react-stack
