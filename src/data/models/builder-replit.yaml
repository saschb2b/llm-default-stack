vendor: Replit
family: Replit Agent
kind: product
url: https://replit.com/products/agent
order: 14
blurb: >-
  Replit's full-stack agent picks a stack per prompt rather than enforcing one,
  but its de-facto JavaScript default is React + Vite + Tailwind + shadcn/ui with
  an Express + Postgres backend on Replit's own hosting.
defaultStack:
  framework:
    - name: Vite
      note: React + TS; agent varies it by prompt
  styling:
    - name: Tailwind
  components:
    - name: shadcn/ui
  backend:
    - name: Express + Neon Postgres
      note: Drizzle ORM
    - name: Replit hosting
